<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMU 44 &mdash; MapLibre</title>
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
  #map{position:absolute;inset:0}
  #panel{position:absolute;top:10px;left:10px;z-index:5;width:280px;max-height:calc(100vh - 20px);
    overflow:auto;background:#fdfbf6;border-radius:12px;padding:12px 14px;
    box-shadow:0 3px 14px rgba(0,0,0,.3);font-size:13px}
  h1{font-size:16px;margin:0}
  .sub{color:#777;font-size:11px;margin:2px 0 10px}
  h2{font-size:12px;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.05em;color:#7a4413}
  .row{display:flex;align-items:center;gap:7px;margin:4px 0;font-size:12px}
  .row input[type=checkbox]{width:17px;height:17px}
  .sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto}
  input[type=range]{width:100%}
  button{width:100%;padding:8px;border:0;border-radius:6px;background:#2f6b2f;color:#fff;
    font-size:13px;font-weight:700;cursor:pointer;margin-top:6px}
  button.alt{background:#7a4413}
  button.grey{background:#666}
  #status{margin-top:9px;padding:7px 9px;border-radius:6px;background:#f2efe6;
    font-size:11px;color:#444;white-space:pre-wrap;line-height:1.45}
  .err{background:#fdeaea!important;color:#8a2020!important}
  .ok{background:#eef6ea!important;color:#2f4d27!important}
  #hud{position:absolute;right:10px;bottom:10px;z-index:5;background:rgba(20,16,12,.88);
    color:#fff;font-size:12px;padding:7px 11px;border-radius:8px}
  @media (max-width:700px){
    #panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:50vh;border-radius:14px 14px 0 0;
      padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
    #hud{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 10px)}
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="hud">&mdash;</div>

<div id="panel">
  <h1>GMU 44</h1>
  <div class="sub">MapLibre build &middot; port in progress</div>

  <h2>View</h2>
  <div class="row"><input type="checkbox" id="t3d" checked><label for="t3d">3D terrain</label></div>
  <label style="font-size:11px;color:#666">Exaggeration &mdash; <span id="exV">1.4</span>&times;</label>
  <input type="range" id="exag" min="0" max="3" step="0.1" value="1.4">

  <h2>Layers</h2>
  <div class="row"><input type="checkbox" id="lTopo" checked><span class="sw" style="background:#cfc9b4"></span><label for="lTopo">Base topo</label></div>
  <div class="row"><input type="checkbox" id="lElk"><span class="sw" style="background:#d62728"></span><label for="lElk">Elk probability</label></div>
  <label style="font-size:11px;color:#666">Elk opacity</label>
  <input type="range" id="elkOp" min="0" max="100" value="75">
  <div class="row"><input type="checkbox" id="lCanopy"><span class="sw" style="background:#2f6b2f"></span><label for="lCanopy">Canopy (bands 1&ndash;4)</label></div>

  <h2>Tapping the map sets&hellip;</h2>
  <div class="row"><input type="radio" name="clickmode" id="mDest" value="dest" checked><span class="sw" style="background:#a01010"></span><label for="mDest">Destination</label></div>
  <div class="row"><input type="radio" name="clickmode" id="mStart" value="start"><span class="sw" style="background:#2f6b2f"></span><label for="mStart">Start point</label></div>
  <div class="row"><input type="radio" name="clickmode" id="mMe" value="me"><span class="sw" style="background:#1a73e8"></span><label for="mMe">My position (simulated)</label></div>

  <h2>Route</h2>
  <button id="routeBtn">Find easiest route</button>
  <button id="clearBtn" class="grey">Clear</button>
  <button id="gpsBtn" class="alt">Use real GPS</button>

  <div id="status">Loading&hellip;</div>
</div>

<script>
// ---------------------------------------------------------------------------
// Constants carried over from the OpenSeadragon build. The georeferencing was
// validated against Mount Massive and Holy Cross to within 10 ft, so it is
// reused verbatim rather than re-derived.
// ---------------------------------------------------------------------------
var W = 14989, H = 10004;
var COST_GRID_W = 1873, COST_GRID_H = 1250;
var ELEV_GRID_W = 1873, ELEV_GRID_H = 1250;
var GEO_LON0 = -106.8750600, GEO_LAT0 = 39.5000693;
var GEO_LON1 = -106.5003350, GEO_LAT1 = 39.2499693;
var IMPASSABLE = 100000;
// Cost grid decoding constants. These live in the old build outside costAt and
// were missed when the routing engine was ported -- without them costAt returned
// NaN for every cell, every comparison against it was false, and the search
// explored the whole grid until it hit its time limit.
var COST_LOG_MIN = Math.log(0.02), COST_LOG_MAX = Math.log(28.35);
// Heuristic weight, in cost units per grid cell. The true minimum step cost is
// 0.021, so the original 0.02 was admissible but roughly 1/60th of a typical
// step (median 1.275) -- which makes A* behave almost like Dijkstra and explore
// far more of the map than it needs to. 0.30 sits below the 3rd percentile of
// real step costs: fast, and still conservative enough that paths stay sensible.
var HEURISTIC_PER_CELL = 0.30;

var TILES = 'https://alexb7592.github.io/Elk-Scouting-Tool/tiles/';
var GRIDS = 'https://alexb7592.github.io/Elk-Scouting-Tool/grids/';

var costGridData = null, elevGridData = null, stealthRiskGrid = null;

function latLonToImagePixel(lat, lon) {
  return { x: (lon - GEO_LON0) / (GEO_LON1 - GEO_LON0) * W,
           y: (lat - GEO_LAT0) / (GEO_LAT1 - GEO_LAT0) * H };
}
function imagePixelToLatLon(x, y) {
  return { lat: GEO_LAT0 + (y / H) * (GEO_LAT1 - GEO_LAT0),
           lon: GEO_LON0 + (x / W) * (GEO_LON1 - GEO_LON0) };
}
function toGrid(ll) {
  var p = latLonToImagePixel(ll.lat, ll.lon);
  return [Math.max(0, Math.min(COST_GRID_W - 1, Math.round(p.x * COST_GRID_W / W))),
          Math.max(0, Math.min(COST_GRID_H - 1, Math.round(p.y * COST_GRID_H / H)))];
}

// --- routing engine, ported unchanged from the working build ----------------
function PQueue() { this.items = []; }
  PQueue.prototype.push = function(item, priority) {
    this.items.push({item:item, priority:priority});
    var i = this.items.length - 1;
    while (i > 0) {
      var parent = (i-1) >> 1;
      if (this.items[parent].priority <= this.items[i].priority) break;
      var tmp = this.items[parent]; this.items[parent] = this.items[i]; this.items[i] = tmp;
      i = parent;
    }
  };
  PQueue.prototype.pop = function() {
    var top = this.items[0];
    var last = this.items.pop();
    if (this.items.length > 0) {
      this.items[0] = last;
      var i = 0;
      while (true) {
        var l = 2*i+1, r = 2*i+2, smallest = i;
        if (l < this.items.length && this.items[l].priority < this.items[smallest].priority) smallest = l;
        if (r < this.items.length && this.items[r].priority < this.items[smallest].priority) smallest = r;
        if (smallest === i) break;
        var tmp = this.items[i]; this.items[i] = this.items[smallest]; this.items[smallest] = tmp;
        i = smallest;
      }
    }
    return top ? top.item : null;
  };
  PQueue.prototype.isEmpty = function() { return this.items.length === 0; };

  
function costAt(gx, gy) {
    if (gx < 0 || gx >= COST_GRID_W || gy < 0 || gy >= COST_GRID_H) return 1000;
    var q = costGridData[gy * COST_GRID_W + gx];
    return Math.exp(COST_LOG_MIN + (q/255) * (COST_LOG_MAX - COST_LOG_MIN));
  }
function elevAt(gx, gy) {
    if (!elevGridData) return null;
    gx = Math.max(0, Math.min(ELEV_GRID_W - 1, gx));
    gy = Math.max(0, Math.min(ELEV_GRID_H - 1, gy));
    return elevGridData[gy * ELEV_GRID_W + gx];
  }
function stealthRiskAt(gx, gy) {
    if (!stealthRiskData) return 0;
    if (gx < 0 || gx >= COST_GRID_W || gy < 0 || gy >= COST_GRID_H) return 0;
    return stealthRiskData[gy * COST_GRID_W + gx];
  }
function aStarRoute(startGx, startGy, endGx, endGy, costFn) {
    costFn = costFn || costAt;
    var W_ = COST_GRID_W, H_ = COST_GRID_H;
    function idx(x,y){ return y*W_+x; }
    var startIdx = idx(startGx,startGy), endIdx = idx(endGx,endGy);
    var gScore = new Float32Array(W_*H_).fill(Infinity);
    var visited = new Uint8Array(W_*H_);
    var cameFrom = new Int32Array(W_*H_).fill(-1);
    gScore[startIdx] = 0;
    var pq = new PQueue();
    function heuristic(x,y){ return Math.sqrt((x-endGx)*(x-endGx)+(y-endGy)*(y-endGy)) * HEURISTIC_PER_CELL; }
    pq.push(startIdx, heuristic(startGx,startGy));
    var neighbors = [[-1,-1,1.4142],[0,-1,1],[1,-1,1.4142],[-1,0,1],[1,0,1],[-1,1,1.4142],[0,1,1],[1,1,1.4142]];
    // Lazy-deletion PQ means worst-case pops run to several times the cell count,
    // so the cap must scale with the grid (1873x1250 = 2.34M cells). A fixed 400k
    // silently aborted wide searches and reported them as 'No route found'.
    var iterations = 0, maxIterations = COST_GRID_W * COST_GRID_H * 12;
    // Wall-clock budget as well as an iteration cap. The cap alone allows ~28M
    // iterations, which runs synchronously for long enough to freeze the tab --
    // and a frozen tab cannot draw map tiles either, so a slow route looked
    // exactly like a broken basemap.
    var __deadline = Date.now() + 12000, __timedOut = false;
    while (!pq.isEmpty() && iterations < maxIterations) {
      if ((iterations & 8191) === 0 && Date.now() > __deadline) { __timedOut = true; break; }
      iterations++;
      var current = pq.pop();
      if (current === endIdx) break;
      if (visited[current]) continue;
      visited[current] = 1;
      var cx = current % W_, cy = (current / W_) | 0;
      for (var n = 0; n < 8; n++) {
        var nx = cx + neighbors[n][0], ny = cy + neighbors[n][1];
        if (nx < 0 || nx >= W_ || ny < 0 || ny >= H_) continue;
        var ni = idx(nx,ny);
        if (visited[ni]) continue;
        var stepCost = costFn(nx,ny) * neighbors[n][2];
        var tentativeG = gScore[current] + stepCost;
        if (tentativeG < gScore[ni]) {
          gScore[ni] = tentativeG;
          cameFrom[ni] = current;
          pq.push(ni, tentativeG + heuristic(nx,ny));
        }
      }
    }
    if (gScore[endIdx] === Infinity) return null;
    var path = [];
    var cur = endIdx;
    while (cur !== -1) {
      path.push([cur % W_, (cur / W_) | 0]);
      cur = cameFrom[cur];
    }
    path.reverse();
    return {path: path, cost: gScore[endIdx]};
  }
// ---------------------------------------------------------------------------

var statusEl = document.getElementById('status');
function say(m, c) { statusEl.textContent = m; statusEl.className = c || ''; }

// Grids were inlined as base64 in the old build, which is most of why that file
// was 7 MB before anything rendered. Here they are fetched separately and cached
// by the browser.
function loadGrid(name, decode, cb) {
  var img = new Image();
  img.crossOrigin = 'anonymous';
  var to = setTimeout(function(){ cb('timeout loading ' + name); }, 20000);
  img.onerror = function(){ clearTimeout(to); cb('failed to load ' + name); };
  img.onload = function() {
    clearTimeout(to);
    var c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    var x = c.getContext('2d');
    x.drawImage(img, 0, 0);
    var d = x.getImageData(0, 0, img.width, img.height).data;
    try { decode(d, img.width * img.height); cb(null); }
    catch (e) { cb('decode failed for ' + name + ': ' + e.message); }
  };
  img.src = GRIDS + name;
}

// On startup, check each archive directly with a range request. If the basemap
// is blank this says whether the files are reachable and valid, rather than
// leaving a silent blank canvas.
function selfTest() {
  var files = ['gmu44_topo.pmtiles','gmu44_terrain.pmtiles','gmu44_elk_probability.pmtiles',
               'gmu44_canopy_band1.pmtiles'];
  var lines = [], left = files.length;
  files.forEach(function(f) {
    fetch(TILES + f, { headers: { Range: 'bytes=0-127' } })
      .then(function(r) {
        if (!r.ok && r.status !== 206) { lines.push(f + ': HTTP ' + r.status); return null; }
        return r.arrayBuffer().then(function(b) {
          var magic = new TextDecoder().decode(new Uint8Array(b, 0, 7));
          lines.push(f + ': ' + (r.status === 206 ? 'ranges OK' : 'HTTP ' + r.status) +
                     (magic.indexOf('PMTiles') === 0 ? ', valid header' : ', BAD HEADER "' + magic + '"'));
        });
      })
      .catch(function(e) { lines.push(f + ': fetch failed \u2014 ' + e.message); })
      .finally(function() {
        if (--left === 0) {
          var bad = lines.filter(function(l){ return l.indexOf('OK') === -1 || l.indexOf('BAD') > -1; });
          say('Archive check:\n' + lines.sort().join('\n'), bad.length ? 'err' : 'ok');
        }
      });
  });
}

var protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

var map = new maplibregl.Map({
  container: 'map',
  style: { version: 8, sources: {}, layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': '#e8e4d9' } } ] },
  center: [-106.6875, 39.375], zoom: 12, pitch: 55, maxPitch: 85, maxZoom: 18
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.boxZoom.disable(); // shift-drag box zoom otherwise swallows shift interactions

map.on('error', function(e) {
  var m = (e && e.error && e.error.message) ? e.error.message : String(e);
  say('Map error: ' + m, 'err');
  console.error('maplibre:', e);
});
map.on('load', function() {
  map.addSource('topo', { type: 'raster', url: 'pmtiles://' + TILES + 'gmu44_topo.pmtiles', tileSize: 512 });
  map.addLayer({ id: 'topo', type: 'raster', source: 'topo' });

  map.addSource('dem', { type: 'raster-dem', url: 'pmtiles://' + TILES + 'gmu44_terrain.pmtiles',
                         tileSize: 512, encoding: 'mapbox' });
  map.setTerrain({ source: 'dem', exaggeration: 1.4 });
  map.setSky({ 'sky-color': '#8fb8e0', 'horizon-color': '#dfe8f0',
               'fog-color': '#e8e4d9', 'fog-ground-blend': 0.5 });

  map.addSource('elk', { type: 'raster', url: 'pmtiles://' + TILES + 'gmu44_elk_probability.pmtiles', tileSize: 512 });
  map.addLayer({ id: 'elk', type: 'raster', source: 'elk',
                 layout: { visibility: 'none' }, paint: { 'raster-opacity': 0.75 } });

  ['1','2','3','4'].forEach(function(b) {
    map.addSource('canopy'+b, { type: 'raster', url: 'pmtiles://' + TILES + 'gmu44_canopy_band'+b+'.pmtiles', tileSize: 512 });
    map.addLayer({ id: 'canopy'+b, type: 'raster', source: 'canopy'+b,
                   layout: { visibility: 'none' }, paint: { 'raster-opacity': 0.65 } });
  });

  // route + markers as data, not hand-drawn SVG
  map.addSource('route', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'route-line', type: 'line', source: 'route',
    paint: { 'line-color': '#ff3c1a', 'line-width': 4, 'line-dasharray': [2, 1.4] } });
  map.addSource('pts', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'pts-circles', type: 'circle', source: 'pts',
    paint: { 'circle-radius': 7, 'circle-color': ['get','color'],
             'circle-stroke-width': 2, 'circle-stroke-color': '#fff' } });

  say('Map up. Loading terrain grids…');
  var pending = 3, errs = [];
  // Signature is (err) -- loadGrid passes the error as its single callback arg.
  function done(err) {
    if (err) errs.push(err);
    if (--pending) return;
    if (errs.length) { say('Grid problems:\n' + errs.join('\n'), 'err'); return; }
    // Loop rather than Math.min.apply: applying over 2.3 million values
    // overflows the argument stack and throws.
    var lo = Infinity, hi = -Infinity;
    for (var i = 0; i < elevGridData.length; i++) {
      var v = elevGridData[i];
      if (v < lo) lo = v;
      if (v > hi) hi = v;
    }
    say('Grids OK (' + Math.round(lo).toLocaleString() + '–' +
        Math.round(hi).toLocaleString() + ' ft). Checking map archives…', 'ok');
    selfTest();
  }
  // The cost grid is a single grayscale byte per cell in the R channel; costAt
  // maps that 0-255 value through the log curve. An earlier version of this
  // loader decoded it as a 16-bit R/G pair divided by 100, which fed values in
  // the tens of thousands into a formula expecting 0-255 and produced a
  // meaningless cost surface -- routes wandered miles off the obvious line.
  loadGrid('cost_grid.png', function(d, n) {
    var a = new Uint8Array(n);
    for (var i = 0; i < n; i++) a[i] = d[i*4];
    costGridData = a; return a;
  }, done);
  loadGrid('elev_grid.png', function(d, n) {
    var a = new Float32Array(n);
    for (var i = 0; i < n; i++) a[i] = (d[i*4] * 256 + d[i*4+1]) * 0.25;
    elevGridData = a; return a;
  }, done);
  loadGrid('stealth_risk_grid.png', function(d, n) {
    var a = new Uint8Array(n);   // grayscale tier 0-3 in the R channel
    for (var i = 0; i < n; i++) a[i] = d[i*4];
    stealthRiskGrid = a; return a;
  }, done);
});

// --- interaction ------------------------------------------------------------
var startLL = null, endLL = null, meLL = null;
function refreshPoints() {
  var f = [];
  if (startLL) f.push({type:'Feature', properties:{color:'#2f6b2f'}, geometry:{type:'Point', coordinates:[startLL.lon, startLL.lat]}});
  if (endLL)   f.push({type:'Feature', properties:{color:'#a01010'}, geometry:{type:'Point', coordinates:[endLL.lon, endLL.lat]}});
  if (meLL)    f.push({type:'Feature', properties:{color:'#1a73e8'}, geometry:{type:'Point', coordinates:[meLL.lon, meLL.lat]}});
  map.getSource('pts').setData({type:'FeatureCollection', features:f});
}
function clickMode() {
  var r = document.querySelector('input[name=clickmode]:checked');
  return r ? r.value : 'dest';
}
map.on('click', function(e) {
  var ll = { lat: e.lngLat.lat, lon: e.lngLat.lng };
  var m = clickMode();
  if (m === 'me') meLL = ll;
  else if (m === 'start') startLL = ll;
  else endLL = ll;
  refreshPoints();
  // After placing a destination, assume the next tap is the start. Saves a trip
  // back to the panel for the common case, and there is no modifier key on a phone.
  if (m === 'dest' && !startLL) document.getElementById('mStart').checked = true;
});
map.on('mousemove', function(e) {
  var m = map.queryTerrainElevation(e.lngLat);
  document.getElementById('hud').textContent =
    e.lngLat.lat.toFixed(5) + ', ' + e.lngLat.lng.toFixed(5) +
    (m == null ? '' : '  ·  ' + Math.round(m * 3.28084).toLocaleString() + ' ft');
});

document.getElementById('routeBtn').addEventListener('click', function() {
  if (!costGridData) { say('Grids are not loaded yet.', 'err'); return; }
  if (!startLL || !endLL) { say('Need both a start and a destination \u2014 use the tap mode above.', 'err'); return; }
  var s = toGrid(startLL), t = toGrid(endLL);
  say('Routing…');
  setTimeout(function() {
    var t0 = Date.now();
    var res = aStarRoute(s[0], s[1], t[0], t[1], costAt);
    var secs = ((Date.now() - t0) / 1000).toFixed(1);
    if (!res) {
      say('No route after ' + secs + 's. Either the points are unreachable, or the ' +
          'search hit its time budget \u2014 try points closer together.', 'err');
      return;
    }
    var coords = res.path.map(function(g) {
      var ll = imagePixelToLatLon(g[0] * W / COST_GRID_W, g[1] * H / COST_GRID_H);
      return [ll.lon, ll.lat];
    });
    map.getSource('route').setData({ type:'Feature', properties:{},
      geometry:{ type:'LineString', coordinates: coords } });
    var gain = 0, prev = null;
    res.path.forEach(function(g) {
      var e = elevAt(g[0], g[1]);
      if (e == null) return;
      if (prev != null && e > prev) gain += e - prev;
      prev = e;
    });
    var d = 0;
    for (var i = 1; i < coords.length; i++) {
      var a = coords[i-1], b = coords[i];
      var dx = (b[0]-a[0]) * 111320 * Math.cos(a[1]*Math.PI/180), dy = (b[1]-a[1]) * 111320;
      d += Math.sqrt(dx*dx + dy*dy);
    }
    say('Route: ' + (d/1609.34).toFixed(2) + ' mi, +' + Math.round(gain).toLocaleString() + ' ft climb (' + secs + 's)', 'ok');
  }, 20);
});
document.getElementById('clearBtn').addEventListener('click', function() {
  startLL = endLL = null; refreshPoints();
  map.getSource('route').setData({type:'FeatureCollection', features:[]});
  say('Cleared.');
});
document.getElementById('gpsBtn').addEventListener('click', function() {
  if (!navigator.geolocation) { say('No geolocation available.', 'err'); return; }
  navigator.geolocation.watchPosition(function(p) {
    meLL = { lat: p.coords.latitude, lon: p.coords.longitude };
    refreshPoints();
  }, function(e) { say('GPS: ' + e.message, 'err'); }, { enableHighAccuracy: true });
});

function vis(id, on) { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'); }
document.getElementById('lTopo').addEventListener('change', function(){ vis('topo', this.checked); });
document.getElementById('lElk').addEventListener('change', function(){ vis('elk', this.checked); });
document.getElementById('lCanopy').addEventListener('change', function(){
  var on = this.checked; ['1','2','3','4'].forEach(function(b){ vis('canopy'+b, on); });
});
document.getElementById('elkOp').addEventListener('input', function(){
  if (map.getLayer('elk')) map.setPaintProperty('elk','raster-opacity', +this.value/100);
});
document.getElementById('t3d').addEventListener('change', function(){
  map.setTerrain(this.checked ? { source:'dem', exaggeration:+document.getElementById('exag').value } : null);
});
